{% load i18n %}
{% translate "Unknown File" as unknown %}
<form
  action="{% url "main:setup:interpret" slug=study.slug uuid=uuid %}"
  class="centered-form"
  method="POST"
>
  {% csrf_token %}
  <button
    class="btn btn-primary"
    name="save"
    type="submit"
  >
    <i class="fas fa-floppy-disk"></i>
    {% translate "Save" %}
  </button>
  <button
    class="btn btn-outline-secondary"
    name="abort"
    type="submit"
  >
    <i class="fas fa-trash-can"></i>
    {% translate "Discard" %}
  </button>
</form>

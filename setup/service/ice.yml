networks:
  icenet: {}
services:
  http:
    environment:
      ICE_NAME: edd
      ICE_URL: http://ice:8080/
    networks:
      - icenet
  ice:
    environment:
      ICE_DATA_HOME: /usr/local/ice-data
      VIRTUAL_STATIC: "true"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - -ISs
        - http://localhost:8080/
      interval: 15s
      start_period: 120s
      timeout: 5s
      retries: 5
    image: jbei/ice:latest
    networks:
      - icenet
    volumes:
      - ice_index:/var/lib/ice/lucene
      - ice_local:/usr/local/tomcat/data
      - ./secrets/edd_ice_key:/usr/local/ice-data/rest-auth/edd:ro
      - ./secrets/ice-server.properties:/usr/local/ice-data/config/ice-server.properties
  postgres:
    networks:
      - icenet
    volumes:
      - ./secrets/001_ice-init.sql:/docker-entrypoint-initdb.d/001_ice-init.sql
  websocket:
    environment:
      ICE_NAME: edd
      ICE_URL: http://ice:8080/
    networks:
      - icenet
  worker:
    environment:
      ICE_NAME: edd
      ICE_URL: http://ice:8080/
    networks:
      - icenet
volumes:
  ice_index: {}
  ice_local: {}
  ice_pg: {}
